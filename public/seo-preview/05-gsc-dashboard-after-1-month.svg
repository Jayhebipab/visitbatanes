    <rect x="0" y="0" width="920" height="200" rx="12" fill="#e6f4ea" stroke="#a8d5b9" stroke-width="1"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#137333">🔮 Predicted GSC Performance — 1 month from launch</text>
    <text x="20" y="60" font-size="12" fill="#202124">Yan ang expected appearance ng Performance dashboard mo around 30 days from now.</text>
    <text x="20" y="85" font-size="12" fill="#202124">Numbers may vary depending on:</text>
    <text x="35" y="105" font-size="12" fill="#3c4043">• Backlinks (kung may nag-share at nag-link sa site)</text>
    <text x="35" y="125" font-size="12" fill="#3c4043">• Social media engagement (FB, IG, TikTok reels mentioning Batanes)</text>
    <text x="35" y="145" font-size="12" fill="#3c4043">• Content freshness (kung may bagong travel guide post weekly/monthly)</text>
    <text x="35" y="165" font-size="12" fill="#3c4043">• Local citation (kung naka-list sa Tripadvisor, Lonely Planet, etc.)</text>
    <text x="35" y="185" font-size="12" fill="#3c4043">• Domain authority — vercel.app subdomain has limited authority vs custom .ph domain</text>
