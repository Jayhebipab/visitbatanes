  <!-- Indexing summary -->
  <g transform="translate(40, 1030)">
    <rect x="0" y="0" width="920" height="100" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    <text x="20" y="30" font-size="15" font-weight="500" fill="#202124">📄 Pages indexed</text>

    <text x="20" y="65" font-size="28" font-weight="400" fill="#0d8043">22</text>
    <text x="80" y="68" font-size="12" fill="#5f6368">/ 22 pages submitted via sitemap</text>

    <text x="20" y="88" font-size="11" fill="#5f6368">All your destination pages, travel guides, tour pages, and core pages are indexed.</text>
