<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 900 1300" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="900" height="1300" fill="#f0f2f5"/>

  <text x="450" y="40" font-size="22" font-weight="700" fill="#1c1e21" text-anchor="middle">Social Media Share Previews</text>
  <text x="450" y="65" font-size="13" fill="#65676b" text-anchor="middle">Paano magmu-mukha kapag may nag-share ng /faq, /about, /contact, /travel-guide</text>

  <!-- ====== Facebook Card ====== -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="380" height="430" rx="10" fill="#ffffff" filter="url(#cardshadow)"/>

    <!-- FB header -->
    <circle cx="35" cy="30" r="15" fill="#0a4d68"/>
    <text x="35" y="35" font-size="14" font-weight="bold" fill="white" text-anchor="middle">V</text>
    <text x="60" y="28" font-size="13" font-weight="600" fill="#050505">Visit Batanes</text>
    <text x="60" y="44" font-size="11" fill="#65676b">2h · 🌍</text>

    <text x="20" y="78" font-size="13" fill="#050505">Plan your dream Batanes trip with our complete</text>
    <text x="20" y="96" font-size="13" fill="#050505">travel guide ✈️🏝️</text>

    <!-- OG image -->
    <rect x="0" y="120" width="380" height="200" fill="#062e3f"/>
    <circle cx="285" cy="165" r="45" fill="#c39348" opacity="0.95"/>
    <path d="M 0 235 Q 95 215 190 220 T 380 200 L 380 320 L 0 320 Z" fill="#5fb487"/>
    <path d="M 0 260 Q 95 245 190 250 T 380 245 L 380 320 L 0 320 Z" fill="#2d6a47"/>
    <text x="20" y="155" font-size="11" font-style="italic" fill="#fbfaf6" letter-spacing="3">VISIT BATANES</text>
    <text x="20" y="195" font-size="22" font-style="italic" fill="#fbfaf6">The northernmost</text>
    <text x="20" y="220" font-size="22" font-style="italic" fill="#fbfaf6">paradise of the</text>
    <text x="20" y="245" font-size="22" font-style="italic" fill="#fbfaf6">Philippines.</text>

    <!-- Link card metadata -->
    <rect x="0" y="320" width="380" height="80" fill="#f0f2f5"/>
    <text x="15" y="345" font-size="10" fill="#65676b" letter-spacing="0.5">VISITBATANES.VERCEL.APP</text>
    <text x="15" y="365" font-size="14" font-weight="600" fill="#050505">Batanes Travel Guide — Itineraries,</text>
    <text x="15" y="380" font-size="14" font-weight="600" fill="#050505">Tips &amp; Local Stories</text>
    <text x="15" y="395" font-size="12" fill="#65676b">In-depth travel guides for Batanes — best...</text>

    <!-- FB engagement -->
    <line x1="15" y1="415" x2="365" y2="415" stroke="#ced0d4" stroke-width="0.5"/>
    <text x="20" y="425" font-size="11" fill="#65676b">👍 Like  💬 Comment  ↪ Share</text>

    <!-- Platform label -->
    <text x="190" y="-15" font-size="13" font-weight="600" fill="#1877f2" text-anchor="middle">📘 Facebook / Messenger</text>
  </g>

  <!-- ====== Twitter / X Card ====== -->
  <g transform="translate(470, 100)">
    <rect x="0" y="0" width="380" height="430" rx="16" fill="#ffffff" filter="url(#cardshadow)"/>

    <!-- Twitter header -->
    <circle cx="35" cy="30" r="15" fill="#0a4d68"/>
    <text x="35" y="35" font-size="14" font-weight="bold" fill="white" text-anchor="middle">V</text>
    <text x="60" y="28" font-size="13" font-weight="700" fill="#0f1419">Visit Batanes</text>
    <text x="150" y="28" font-size="13" fill="#536471">@VisitBatanesPH · 2h</text>

    <text x="60" y="60" font-size="14" fill="#0f1419">Discover the FAQs of Batanes travel — when</text>
    <text x="60" y="78" font-size="14" fill="#0f1419">to visit, how to get there, what to eat 🌅</text>
    <text x="60" y="100" font-size="14" fill="#1d9bf0">visitbatanes.vercel.app/faq</text>

    <!-- Twitter card (large image) -->
    <rect x="60" y="120" width="300" height="180" rx="16" fill="#062e3f"/>
    <circle cx="290" cy="160" r="35" fill="#c39348" opacity="0.95"/>
    <path d="M 60 230 Q 135 215 210 220 T 360 205 L 360 300 L 60 300 Z" fill="#5fb487"/>
    <path d="M 60 250 Q 135 240 210 245 T 360 240 L 360 300 L 60 300 Z" fill="#2d6a47"/>
    <text x="75" y="155" font-size="9" font-style="italic" fill="#fbfaf6" letter-spacing="2">VISIT BATANES</text>
    <text x="75" y="185" font-size="16" font-style="italic" fill="#fbfaf6">The northernmost</text>
    <text x="75" y="205" font-size="16" font-style="italic" fill="#fbfaf6">paradise of the PH.</text>

    <!-- Card meta -->
    <rect x="60" y="300" width="300" height="60" rx="0" fill="#ffffff"/>
    <text x="70" y="320" font-size="11" fill="#536471">visitbatanes.vercel.app</text>
    <text x="70" y="338" font-size="13" font-weight="600" fill="#0f1419">FAQs — Batanes Travel, Booking,</text>
    <text x="70" y="354" font-size="13" font-weight="600" fill="#0f1419">Safety, Culture &amp; Itinerary</text>

    <!-- engagement -->
    <text x="60" y="395" font-size="12" fill="#536471">💬 12   🔁 84   ❤ 247   📊 5.2k   📌</text>

    <text x="190" y="-15" font-size="13" font-weight="600" fill="#0f1419" text-anchor="middle">🐦 Twitter / X</text>
  </g>

  <!-- ====== LinkedIn Card ====== -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="380" height="370" rx="8" fill="#ffffff" filter="url(#cardshadow)"/>

    <!-- LinkedIn header -->
    <circle cx="35" cy="30" r="15" fill="#0a4d68"/>
    <text x="35" y="35" font-size="14" font-weight="bold" fill="white" text-anchor="middle">V</text>
    <text x="60" y="28" font-size="13" font-weight="600" fill="#000">Visit Batanes</text>
    <text x="60" y="44" font-size="11" fill="#666">Travel agency · Philippines</text>
    <text x="60" y="58" font-size="11" fill="#666">2h · 🌍</text>

    <text x="20" y="90" font-size="13" fill="#000">Slow travel, local hearts, quiet luxury.</text>
    <text x="20" y="108" font-size="13" fill="#000">Learn about our Ivatan-led tours →</text>

    <!-- OG image -->
    <rect x="0" y="130" width="380" height="170" fill="#062e3f"/>
    <circle cx="290" cy="170" r="38" fill="#c39348" opacity="0.95"/>
    <path d="M 0 230 Q 95 215 190 220 T 380 205 L 380 300 L 0 300 Z" fill="#5fb487"/>
    <text x="20" y="160" font-size="10" font-style="italic" fill="#fbfaf6" letter-spacing="2">VISIT BATANES</text>
    <text x="20" y="195" font-size="18" font-style="italic" fill="#fbfaf6">Slow travel,</text>
    <text x="20" y="220" font-size="18" font-style="italic" fill="#fbfaf6">local hearts.</text>

    <!-- Link card -->
    <rect x="0" y="300" width="380" height="50" fill="#eef3f8"/>
    <text x="15" y="320" font-size="13" font-weight="600" fill="#000">About Visit Batanes — Slow Travel, Local Hearts</text>
    <text x="15" y="340" font-size="11" fill="#666">visitbatanes.vercel.app</text>

    <text x="190" y="-15" font-size="13" font-weight="600" fill="#0a66c2" text-anchor="middle">💼 LinkedIn</text>
  </g>

  <!-- ====== iMessage / Viber Card ====== -->
  <g transform="translate(470, 580)">
    <rect x="0" y="0" width="380" height="370" rx="22" fill="#ffffff" filter="url(#cardshadow)"/>

    <text x="190" y="-15" font-size="13" font-weight="600" fill="#34c759" text-anchor="middle">💬 iMessage / Viber / WhatsApp</text>

    <!-- Chat bubble outgoing -->
    <g transform="translate(20, 20)">
      <rect x="80" y="0" width="280" height="60" rx="18" fill="#007aff"/>
      <text x="100" y="25" font-size="12" fill="white">Hey, planning Batanes trip this March?</text>
      <text x="100" y="45" font-size="12" fill="white">Check this site:</text>
    </g>

    <!-- Link preview card -->
    <g transform="translate(20, 90)">
      <rect x="80" y="0" width="280" height="240" rx="18" fill="#e9e9eb"/>

      <!-- Image preview -->
      <rect x="80" y="0" width="280" height="140" rx="18" fill="#062e3f"/>
      <circle cx="295" cy="55" r="28" fill="#c39348" opacity="0.95"/>
      <path d="M 80 100 Q 150 85 220 90 T 360 85 L 360 140 L 80 140 Z" fill="#5fb487"/>
      <text x="95" y="55" font-size="9" font-style="italic" fill="#fbfaf6" letter-spacing="2">VISIT BATANES</text>
      <text x="95" y="85" font-size="14" font-style="italic" fill="#fbfaf6">Northernmost</text>
      <text x="95" y="105" font-size="14" font-style="italic" fill="#fbfaf6">paradise of PH</text>

      <!-- Metadata -->
      <text x="95" y="165" font-size="12" font-weight="600" fill="#000">Contact Visit Batanes — Plan Your</text>
      <text x="95" y="182" font-size="12" font-weight="600" fill="#000">Trip</text>
      <text x="95" y="202" font-size="11" fill="#666">Reach out for a custom Batanes itinerary,</text>
      <text x="95" y="217" font-size="11" fill="#666">tour booking inquiries, or any planning...</text>
      <text x="95" y="232" font-size="10" fill="#999">visitbatanes.vercel.app</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 990)">
    <rect x="0" y="0" width="800" height="280" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#1c1e21">🔗 Bakit ganito ang itsura ng share previews</text>

    <text x="20" y="60" font-size="12" fill="#3c4043">Lahat ng nasa preview ay galing sa OpenGraph + Twitter Card meta tags na nasa root layout mo:</text>

    <g transform="translate(20, 80)" font-family="ui-monospace, 'Courier New', monospace" font-size="11">
      <rect x="0" y="0" width="760" height="180" rx="6" fill="#f6f8fa"/>
      <text x="15" y="20" fill="#cf222e">&lt;meta property="og:title"</text>
      <text x="170" y="20" fill="#0550ae">content=</text>
      <text x="220" y="20" fill="#0a3069">"Visit Batanes — The Northernmost Paradise..."</text>
      <text x="15" y="40" fill="#cf222e">&lt;meta property="og:description"</text>
      <text x="225" y="40" fill="#0550ae">content=</text>
      <text x="275" y="40" fill="#0a3069">"Discover Batanes — rolling hills..."</text>
      <text x="15" y="60" fill="#cf222e">&lt;meta property="og:image"</text>
      <text x="183" y="60" fill="#0550ae">content=</text>
      <text x="233" y="60" fill="#0a3069">"https://visitbatanes.vercel.app/og-default.svg"</text>
      <text x="15" y="80" fill="#cf222e">&lt;meta property="og:url"</text>
      <text x="167" y="80" fill="#0550ae">content=</text>
      <text x="217" y="80" fill="#0a3069">"https://visitbatanes.vercel.app/about"</text>
      <text x="15" y="100" fill="#cf222e">&lt;meta property="og:type"</text>
      <text x="173" y="100" fill="#0550ae">content=</text>
      <text x="223" y="100" fill="#0a3069">"website"</text>
      <text x="15" y="120" fill="#cf222e">&lt;meta property="og:locale"</text>
      <text x="186" y="120" fill="#0550ae">content=</text>
      <text x="236" y="120" fill="#0a3069">"en_PH"</text>
      <text x="15" y="140" fill="#cf222e">&lt;meta name="twitter:card"</text>
      <text x="181" y="140" fill="#0550ae">content=</text>
      <text x="231" y="140" fill="#0a3069">"summary_large_image"</text>
      <text x="15" y="165" fill="#57606a" font-style="italic">// Lahat ng pages mo (about, faq, contact, travel-guide) ay may unique og:title at og:description.</text>
    </g>
  </g>

  <defs>
    <filter id="cardshadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
</svg>
